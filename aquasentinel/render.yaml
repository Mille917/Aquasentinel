services:
  - type: web
    name: aquasentinel
    env: node
    buildCommand: |
      npm install
      npm run build
    startCommand: node build/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
